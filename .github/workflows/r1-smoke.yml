name: BWD smoke and security checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check portal.js
          node --check meeting-pdf-reader.js
      - name: Check R1 and R2 source contracts
        run: node --test tests/*.test.mjs
